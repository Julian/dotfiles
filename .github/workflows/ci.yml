name: CI

on:
  push:
  schedule:
    # Daily at 8:11
    - cron: "11 8 * * *"

concurrency:
  group: "dotfiles"
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false
      - name: Trust our tap
        run: brew tap julian/tap && brew trust julian/tap
        if: runner.os == 'macOS'
      - name: Install packages
        run: brew bundle install
        if: runner.os == 'macOS'
        continue-on-error: true
      - name: Install packages
        run: sudo apt-get install -y zsh
        if: runner.os == 'Linux'
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: false
      - name: Install the Pythons our virtualenvs want
        run: uv python install 3.13 pypy
      - name: Bootstrap
        run: uv run ./install
      - name: Converge venvs
        run: uvx venvs converge
        env:
          DEVELOPMENT: ${{ runner.temp }}/Development
